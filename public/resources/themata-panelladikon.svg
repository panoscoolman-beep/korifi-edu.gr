  <rect x="160" y="56" width="118" height="30" rx="10" fill="#3730a3"/>
  <rect x="160" y="74" width="118" height="12" fill="#3730a3"/>
  <rect x="174" y="64" width="66" height="6" rx="3" fill="#ffffff"/>
