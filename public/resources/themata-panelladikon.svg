    <rect x="176" y="114" width="86" height="6" rx="3"/>
    <rect x="176" y="128" width="70" height="6" rx="3"/>
    <rect x="176" y="148" width="86" height="6" rx="3"/>
    <rect x="176" y="162" width="86" height="6" rx="3"/>
