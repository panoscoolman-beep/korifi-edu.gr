    <rect x="150" y="64" width="118" height="168" rx="10" fill="#c7d2fe"/>
  </g>
  <!-- μπροστινό φύλλο -->
  <rect x="160" y="56" width="118" height="176" rx="10" fill="#ffffff" stroke="#3730a3" stroke-width="3"/>
