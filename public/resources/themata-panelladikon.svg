  <circle cx="262" cy="212" r="23" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M250 212 l8 8 l16 -18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
