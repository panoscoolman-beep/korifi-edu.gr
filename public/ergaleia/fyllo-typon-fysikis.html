<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#060d1b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Φύλλο τύπων Φυσικής με αναζήτηση — κινηματική, δυναμική, ενέργεια, ηλεκτρισμός, ταλαντώσεις, κύματα. Φροντιστήριο Κορυφή.">
  <title>Φύλλο Τύπων Φυσικής — Φροντιστήριο Κορυφή</title>
  <style>
    :root{
      --bg:#060d1b; --bg2:#0b1a30; --bg3:#0f2040;
      --text:#c8d8e8; --dim:#2a5080; --border:#1a3050; --accent:#7ec8e3;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{background:var(--bg);color:var(--text);font-family:'Courier New',Courier,monospace;min-height:100dvh;}
    body{overscroll-behavior:none;}
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:var(--bg);}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

    /* ── Toolbar (back to hub) ───────────── */
    .toolbar{max-width:680px;margin:0 auto;padding:10px 12px 0;}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;color:var(--dim);text-decoration:none;text-transform:uppercase;padding:6px 10px;border:1px solid var(--border);border-radius:20px;transition:color .15s,border-color .15s;}
    .back-link:hover,.back-link:active{color:#7ec8e3;border-color:#7ec8e3;}

    /* ── Layout ─────────────────────────── */
    #app{max-width:680px;margin:0 auto;padding:4px 12px 48px;}

    /* ── Header ─────────────────────────── */
    .hdr{text-align:center;margin:10px 0 16px;}
    .hdr-sub{font-size:8px;letter-spacing:.35em;color:var(--dim);margin-bottom:4px;text-transform:uppercase;}
    .hdr-title{font-size:20px;font-weight:bold;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;line-height:1.2;}
    .hdr-hint{font-size:9px;color:var(--dim);margin-top:5px;letter-spacing:.08em;}

    /* ── Search box ─────────────────────── */
    .search-wrap{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 6px;}
    .search-row{position:relative;}
    #search{
      width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;
      color:var(--text);font-family:inherit;font-size:14px;letter-spacing:.02em;
      padding:12px 38px 12px 14px;outline:none;transition:border-color .15s;
    }
    #search::placeholder{color:var(--dim);}
    #search:focus{border-color:var(--accent);}
    .clear-btn{
      position:absolute;right:8px;top:50%;transform:translateY(-50%);
      width:26px;height:26px;border:none;background:transparent;color:var(--dim);
      font-size:18px;cursor:pointer;line-height:1;border-radius:50%;display:none;
    }
    .clear-btn:hover{color:var(--accent);}
    .clear-btn.show{display:block;}

    /* ── Category chips ─────────────────── */
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px;}
    .chip{
      font-family:inherit;font-size:10px;letter-spacing:.04em;
      color:var(--dim);background:var(--bg2);border:1px solid var(--border);
      border-radius:16px;padding:6px 11px;cursor:pointer;
      transition:color .15s,border-color .15s,background .15s;white-space:nowrap;
    }
    .chip:hover{color:var(--accent);border-color:var(--accent);}
    .chip.active{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:bold;}

    /* ── Result count ───────────────────── */
    .count{font-size:9px;letter-spacing:.1em;color:var(--dim);margin:8px 2px 4px;text-transform:uppercase;}

    /* ── Cards ──────────────────────────── */
    .cards{display:flex;flex-direction:column;gap:10px;}
    .card{
      background:var(--bg2);border:1px solid var(--border);border-radius:12px;
      padding:13px 14px;
    }
    .card-cat{font-size:8px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-bottom:5px;}
    .card-name{font-size:13px;font-weight:bold;color:var(--text);letter-spacing:.02em;margin-bottom:9px;line-height:1.35;}
    .card-formula{
      background:var(--bg3);border:1px solid var(--border);border-radius:8px;
      padding:11px 12px;font-size:17px;color:var(--accent);text-align:center;
      letter-spacing:.03em;line-height:1.6;word-break:break-word;margin-bottom:10px;
    }
    .card-symbols{font-size:11px;color:var(--text);line-height:1.6;opacity:.92;}
    .card-symbols .sym{color:var(--accent);font-weight:bold;}
    .card-unit{
      margin-top:9px;padding-top:8px;border-top:1px solid var(--border);
      font-size:10px;letter-spacing:.04em;color:var(--dim);
    }
    .card-unit b{color:var(--text);font-weight:normal;}

    /* ── Empty state ────────────────────── */
    .empty{
      text-align:center;padding:40px 16px;color:var(--dim);
      font-size:12px;letter-spacing:.06em;line-height:1.8;display:none;
    }
    .empty.show{display:block;}
    .empty .big{font-size:30px;display:block;margin-bottom:10px;opacity:.6;}

    /* ── Footer ─────────────────────────── */
    .footer{text-align:center;margin-top:22px;font-size:8px;color:var(--dim);letter-spacing:.08em;line-height:1.7;}

    @media (max-width:380px){
      .card-formula{font-size:15px;}
      .hdr-title{font-size:17px;}
    }
  </style>
</head>
<body>
  <div class="toolbar"><a class="back-link" href="/ergaleia">← Εργαλεία</a></div>

  <div id="app">
    <header class="hdr">
      <div class="hdr-sub">Διαδραστικό</div>
      <h1 class="hdr-title">Φύλλο Τύπων Φυσικής</h1>
      <div class="hdr-hint">Αναζήτηση με όνομα, σύμβολο ή λέξη-κλειδί</div>
    </header>

    <div class="search-wrap">
      <div class="search-row">
        <input id="search" type="text" inputmode="search" autocomplete="off"
               placeholder="Αναζήτηση τύπου… (π.χ. ορμή, ω, ενέργεια)"
               aria-label="Αναζήτηση τύπου">
        <button class="clear-btn" id="clearBtn" aria-label="Καθαρισμός">×</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="count" id="count"></div>
    <div class="cards" id="cards"></div>

    <div class="empty" id="empty">
      <span class="big">∅</span>
      Δεν βρέθηκε τύπος.<br>Δοκίμασε άλλη λέξη ή κατηγορία.
    </div>

    <div class="footer">
      Φροντιστήριο Κορυφή — Καλλονή Λέσβου<br>
      Φύλλο τύπων για Γυμνάσιο &amp; Λύκειο
    </div>
  </div>

  <script>
  "use strict";

  /* ============================================================
     ΔΕΔΟΜΕΝΑ — Τύποι Φυσικής (Ελληνικό Πρόγραμμα Γυμνασίου/Λυκείου)
     Κάθε αντικείμενο: {category, name, formula, symbols, unit, keywords}
     Σύμβολα/μονάδες σε SI. ημ/συν = sin/cos (ελληνικός συμβολισμός).
     ============================================================ */
  const FORMULAS = [

    /* ── ΚΙΝΗΜΑΤΙΚΗ ─────────────────────────────── */
    { category:"Κινηματική", name:"Μέση ταχύτητα", formula:"u = Δx / Δt",
      symbols:"u: ταχύτητα, Δx: μετατόπιση, Δt: χρονικό διάστημα", unit:"u σε m/s",
      keywords:"ταχύτητα μέση μετατόπιση δρόμος δt" },
    { category:"Κινηματική", name:"Επιτάχυνση (ορισμός)", formula:"a = Δu / Δt",
      symbols:"a: επιτάχυνση, Δu: μεταβολή ταχύτητας, Δt: χρόνος", unit:"a σε m/s²",
      keywords:"επιτάχυνση μεταβολή ταχύτητας" },
    { category:"Κινηματική", name:"Ευθύγραμμη ομαλή κίνηση", formula:"x = x₀ + u·t",
      symbols:"x: θέση, x₀: αρχική θέση, u: σταθερή ταχύτητα, t: χρόνος", unit:"x σε m",
      keywords:"ομαλη ευθυγραμμη σταθερη ταχυτητα θεση" },
    { category:"Κινηματική", name:"Ταχύτητα στην Ε.Ο.Μ.Κ.", formula:"u = u₀ + a·t",
      symbols:"u: τελική ταχύτητα, u₀: αρχική ταχύτητα, a: επιτάχυνση, t: χρόνος", unit:"u σε m/s",
      keywords:"ομαλα μεταβαλλομενη επιταχυνση ταχυτητα εξισωση" },
    { category:"Κινηματική", name:"Μετατόπιση στην Ε.Ο.Μ.Κ.", formula:"x = u₀·t + ½·a·t²",
      symbols:"x: μετατόπιση, u₀: αρχική ταχύτητα, a: επιτάχυνση, t: χρόνος", unit:"x σε m",
      keywords:"ομαλα μεταβαλλομενη μετατοπιση διαστημα εξισωση κινησης" },
    { category:"Κινηματική", name:"Σχέση ταχύτητας–μετατόπισης", formula:"u² = u₀² + 2·a·x",
      symbols:"u: τελική ταχύτητα, u₀: αρχική ταχύτητα, a: επιτάχυνση, x: μετατόπιση", unit:"u σε m/s",
      keywords:"ανεξαρτητη χρονου ταχυτητα μετατοπιση τετραγωνο" },
    { category:"Κινηματική", name:"Ελεύθερη πτώση (ταχύτητα)", formula:"u = g·t",
      symbols:"u: ταχύτητα, g: επιτάχυνση βαρύτητας ≈ 9,8 m/s², t: χρόνος", unit:"u σε m/s",
      keywords:"ελευθερη πτωση βαρυτητα g πτωση" },
    { category:"Κινηματική", name:"Ελεύθερη πτώση (ύψος)", formula:"h = ½·g·t²",
      symbols:"h: ύψος πτώσης, g: επιτάχυνση βαρύτητας, t: χρόνος", unit:"h σε m",
      keywords:"ελευθερη πτωση υψος βαρυτητα g" },

    /* ── ΔΥΝΑΜΙΚΗ (Νόμοι Νεύτωνα) ───────────────── */
    { category:"Δυναμική", name:"2ος Νόμος Νεύτωνα", formula:"ΣF = m·a",
      symbols:"ΣF: συνισταμένη δύναμη, m: μάζα, a: επιτάχυνση", unit:"F σε N (Newton)",
      keywords:"νευτωνα δευτερος νομος δυναμη μαζα επιταχυνση συνισταμενη θεμελιωδης" },
    { category:"Δυναμική", name:"Βάρος", formula:"B = m·g",
      symbols:"B: βάρος, m: μάζα, g: επιτάχυνση βαρύτητας ≈ 9,8 m/s²", unit:"B σε N",
      keywords:"βαρος μαζα βαρυτητα g" },
    { category:"Δυναμική", name:"Τριβή", formula:"T = μ·N",
      symbols:"T: δύναμη τριβής, μ: συντελεστής τριβής, N: κάθετη (δύναμη) αντίδραση", unit:"T σε N",
      keywords:"τριβη συντελεστης καθετη αντιδραση ολισθηση" },
    { category:"Δυναμική", name:"Δύναμη ελατηρίου (Νόμος Hooke)", formula:"F = k·x",
      symbols:"F: δύναμη επαναφοράς, k: σταθερά ελατηρίου, x: επιμήκυνση/συσπείρωση", unit:"F σε N, k σε N/m",
      keywords:"ελατηριο hooke σταθερα επαναφορα παραμορφωση χουκ" },
    { category:"Δυναμική", name:"1ος Νόμος Νεύτωνα (Αδράνεια)", formula:"ΣF = 0 ⇒ u = σταθερή",
      symbols:"Αν η συνισταμένη δύναμη είναι μηδέν, το σώμα ηρεμεί ή κινείται ευθύγραμμα ομαλά", unit:"—",
      keywords:"νευτωνα πρωτος αδρανεια ισορροπια ηρεμια" },
    { category:"Δυναμική", name:"3ος Νόμος Νεύτωνα (Δράση–Αντίδραση)", formula:"F₁₂ = −F₂₁",
      symbols:"F₁₂: δύναμη του 1 στο 2, F₂₁: δύναμη του 2 στο 1 (ίσες, αντίθετες)", unit:"F σε N",
      keywords:"νευτωνα τριτος δραση αντιδραση ζευγος δυναμεων" },

    /* ── ΕΡΓΟ – ΕΝΕΡΓΕΙΑ – ΙΣΧΥΣ ────────────────── */
    { category:"Έργο–Ενέργεια–Ισχύς", name:"Έργο δύναμης", formula:"W = F·x·συνθ",
      symbols:"W: έργο, F: δύναμη, x: μετατόπιση, θ: γωνία δύναμης–μετατόπισης", unit:"W σε J (Joule)",
      keywords:"εργο δυναμη μετατοπιση γωνια συνημιτονο τζουλ" },
    { category:"Έργο–Ενέργεια–Ισχύς", name:"Κινητική ενέργεια", formula:"Κ = ½·m·u²",
      symbols:"Κ: κινητική ενέργεια, m: μάζα, u: ταχύτητα", unit:"Κ σε J",
      keywords:"κινητικη ενεργεια μαζα ταχυτητα" },
    { category:"Έργο–Ενέργεια–Ισχύς", name:"Δυναμική ενέργεια βαρύτητας", formula:"U = m·g·h",
      symbols:"U: δυναμική ενέργεια, m: μάζα, g: επιτάχυνση βαρύτητας, h: ύψος", unit:"U σε J",
      keywords:"δυναμικη ενεργεια βαρυτικη υψος βαρος θεση" },
    { category:"Έργο–Ενέργεια–Ισχύς", name:"Δυναμική ενέργεια ελατηρίου", formula:"U = ½·k·x²",
      symbols:"U: δυναμική ενέργεια ελατηρίου, k: σταθερά ελατηρίου, x: παραμόρφωση", unit:"U σε J",
      keywords:"δυναμικη ενεργεια ελατηριο σταθερα παραμορφωση ελαστικη" },
    { category:"Έργο–Ενέργεια–Ισχύς", name:"Θεώρημα έργου–ενέργειας", formula:"ΣW = ΔΚ = Κ − Κ₀",
      symbols:"ΣW: συνολικό έργο, ΔΚ: μεταβολή κινητικής ενέργειας", unit:"σε J",
      keywords:"θεωρημα εργου ενεργειας μεταβολη κινητικη ΚΕΘ" },
    { category:"Έργο–Ενέργεια–Ισχύς", name:"Διατήρηση μηχανικής ενέργειας", formula:"Κ₁ + U₁ = Κ₂ + U₂",
      symbols:"Κ: κινητική ενέργεια, U: δυναμική ενέργεια (χωρίς τριβές)", unit:"σε J",
      keywords:"διατηρηση μηχανικη ενεργεια ολικη συντηρητικες τριβες" },
    { category:"Έργο–Ενέργεια–Ισχύς", name:"Ισχύς (μέση)", formula:"P = W / t",
      symbols:"P: ισχύς, W: έργο, t: χρόνος", unit:"P σε W (Watt)",
      keywords:"ισχυς εργο χρονος watt βατ" },
    { category:"Έργο–Ενέργεια–Ισχύς", name:"Ισχύς (στιγμιαία)", formula:"P = F·u",
      symbols:"P: ισχύς, F: δύναμη, u: ταχύτητα (στην κατεύθυνση της F)", unit:"P σε W",
      keywords:"ισχυς δυναμη ταχυτητα στιγμιαια" },
    { category:"Έργο–Ενέργεια–Ισχύς", name:"Απόδοση μηχανής", formula:"η = Pωφ / Pολ = Wωφ / Wολ",
      symbols:"η: απόδοση (0–1 ή %), Pωφ: ωφέλιμη ισχύς, Pολ: ολική ισχύς", unit:"αδιάστατο (ή %)",
      keywords:"αποδοση μηχανη ωφελιμη ολικη συντελεστης ητα" },

    /* ── ΟΡΜΗ ───────────────────────────────────── */
    { category:"Ορμή", name:"Ορμή", formula:"p = m·u",
      symbols:"p: ορμή, m: μάζα, u: ταχύτητα (διανυσματικό μέγεθος)", unit:"p σε kg·m/s",
      keywords:"ορμη μαζα ταχυτητα διανυσμα" },
    { category:"Ορμή", name:"2ος Νόμος Νεύτωνα (ορμή)", formula:"ΣF = Δp / Δt",
      symbols:"ΣF: συνισταμένη δύναμη, Δp: μεταβολή ορμής, Δt: χρόνος", unit:"F σε N",
      keywords:"ορμη ρυθμος μεταβολης δυναμη νευτωνα γενικη μορφη" },
    { category:"Ορμή", name:"Ώθηση δύναμης", formula:"J = F·Δt = Δp",
      symbols:"J: ώθηση, F: δύναμη, Δt: χρόνος, Δp: μεταβολή ορμής", unit:"J σε N·s",
      keywords:"ωθηση δυναμη χρονος μεταβολη ορμης" },
    { category:"Ορμή", name:"Διατήρηση ορμής", formula:"p₁ + p₂ = p₁′ + p₂′",
      symbols:"Σε μονωμένο σύστημα η ολική ορμή διατηρείται (πριν = μετά)", unit:"σε kg·m/s",
      keywords:"διατηρηση ορμης μονωμενο συστημα κρουση συγκρουση" },

    /* ── ΚΥΚΛΙΚΗ ΚΙΝΗΣΗ ─────────────────────────── */
    { category:"Κυκλική κίνηση", name:"Περίοδος & συχνότητα", formula:"T = 1 / f",
      symbols:"T: περίοδος, f: συχνότητα", unit:"T σε s, f σε Hz",
      keywords:"περιοδος συχνοτητα κυκλικη ηερτζ hz" },
    { category:"Κυκλική κίνηση", name:"Γωνιακή ταχύτητα", formula:"ω = 2π / T = 2π·f",
      symbols:"ω: γωνιακή ταχύτητα, T: περίοδος, f: συχνότητα", unit:"ω σε rad/s",
      keywords:"γωνιακη ταχυτητα ωμεγα περιοδος συχνοτητα κυκλικη" },
    { category:"Κυκλική κίνηση", name:"Γραμμική ταχύτητα", formula:"u = ω·r = 2π·r / T",
      symbols:"u: γραμμική ταχύτητα, ω: γωνιακή ταχύτητα, r: ακτίνα", unit:"u σε m/s",
      keywords:"γραμμικη ταχυτητα ακτινα γωνιακη κυκλικη περιφερειακη" },
    { category:"Κυκλική κίνηση", name:"Κεντρομόλος επιτάχυνση", formula:"a_κ = u² / r = ω²·r",
      symbols:"a_κ: κεντρομόλος επιτάχυνση, u: ταχύτητα, r: ακτίνα, ω: γωνιακή ταχύτητα", unit:"a σε m/s²",
      keywords:"κεντρομολος επιταχυνση κυκλικη ακτινα" },
    { category:"Κυκλική κίνηση", name:"Κεντρομόλος δύναμη", formula:"F_κ = m·u² / r = m·ω²·r",
      symbols:"F_κ: κεντρομόλος δύναμη, m: μάζα, u: ταχύτητα, r: ακτίνα, ω: γωνιακή ταχύτητα", unit:"F σε N",
      keywords:"κεντρομολος δυναμη κυκλικη μαζα ακτινα" },

    /* ── ΒΑΡΥΤΗΤΑ ───────────────────────────────── */
    { category:"Βαρύτητα", name:"Νόμος παγκόσμιας έλξης", formula:"F = G·m₁·m₂ / r²",
      symbols:"F: δύναμη βαρ. έλξης, G: σταθερά παγκ. έλξης ≈ 6,67·10⁻¹¹ N·m²/kg², m₁,m₂: μάζες, r: απόσταση", unit:"F σε N",
      keywords:"παγκοσμια ελξη βαρυτητα νευτωνα σταθερα G μαζες αποσταση" },
    { category:"Βαρύτητα", name:"Ένταση βαρυτικού πεδίου", formula:"g = G·M / r²",
      symbols:"g: ένταση πεδίου / επιτάχυνση, G: σταθερά παγκ. έλξης, M: μάζα πλανήτη, r: απόσταση από κέντρο", unit:"g σε m/s² (ή N/kg)",
      keywords:"ενταση βαρυτικου πεδιου επιταχυνση g πλανητης" },

    /* ── ΤΑΛΑΝΤΩΣΕΙΣ (Α.Α.Τ.) ───────────────────── */
    { category:"Ταλαντώσεις", name:"Απομάκρυνση Α.Α.Τ.", formula:"x = A·ημ(ω·t)",
      symbols:"x: απομάκρυνση, A: πλάτος, ω: γωνιακή συχνότητα, t: χρόνος", unit:"x, A σε m",
      keywords:"απλη αρμονικη ταλαντωση απομακρυνση πλατος ημιτονο εξισωση ΑΑΤ" },
    { category:"Ταλαντώσεις", name:"Ταχύτητα Α.Α.Τ.", formula:"u = ω·A·συν(ω·t)",
      symbols:"u: ταχύτητα, ω: γωνιακή συχνότητα, A: πλάτος, t: χρόνος", unit:"u σε m/s",
      keywords:"ταχυτητα αρμονικη ταλαντωση συνημιτονο πλατος ΑΑΤ" },
    { category:"Ταλαντώσεις", name:"Επιτάχυνση Α.Α.Τ.", formula:"a = −ω²·x",
      symbols:"a: επιτάχυνση, ω: γωνιακή συχνότητα, x: απομάκρυνση", unit:"a σε m/s²",
      keywords:"επιταχυνση αρμονικη ταλαντωση απομακρυνση ΑΑΤ" },
    { category:"Ταλαντώσεις", name:"Δύναμη επαναφοράς Α.Α.Τ.", formula:"F = −k·x  (k = m·ω²)",
      symbols:"F: δύναμη επαναφοράς, k: σταθερά επαναφοράς, x: απομάκρυνση, m: μάζα, ω: γων. συχνότητα", unit:"F σε N",
      keywords:"δυναμη επαναφορας αρμονικη ταλαντωση σταθερα ΑΑΤ" },
    { category:"Ταλαντώσεις", name:"Περίοδος ελατηρίου", formula:"T = 2π·√(m / k)",
      symbols:"T: περίοδος, m: μάζα, k: σταθερά ελατηρίου", unit:"T σε s",
      keywords:"περιοδος ελατηριο μαζα σταθερα ταλαντωση ριζα ΑΑΤ" },
    { category:"Ταλαντώσεις", name:"Περίοδος εκκρεμούς", formula:"T = 2π·√(ℓ / g)",
      symbols:"T: περίοδος, ℓ: μήκος νήματος, g: επιτάχυνση βαρύτητας", unit:"T σε s",
      keywords:"περιοδος εκκρεμες μηκος νημα βαρυτητα ταλαντωση ριζα απλο" },
    { category:"Ταλαντώσεις", name:"Ενέργεια ταλάντωσης", formula:"E = ½·k·A²",
      symbols:"E: ολική ενέργεια ταλάντωσης, k: σταθερά επαναφοράς, A: πλάτος", unit:"E σε J",
      keywords:"ενεργεια ταλαντωση ολικη πλατος σταθερα ΑΑΤ" },

    /* ── ΚΥΜΑΤΑ ─────────────────────────────────── */
    { category:"Κύματα", name:"Θεμελιώδης εξίσωση κύματος", formula:"u = λ·f",
      symbols:"u: ταχύτητα διάδοσης, λ: μήκος κύματος, f: συχνότητα", unit:"u σε m/s, λ σε m, f σε Hz",
      keywords:"κυμα ταχυτητα διαδοσης μηκος κυματος συχνοτητα θεμελιωδης λ" },
    { category:"Κύματα", name:"Μήκος κύματος", formula:"λ = u·T = u / f",
      symbols:"λ: μήκος κύματος, u: ταχύτητα, T: περίοδος, f: συχνότητα", unit:"λ σε m",
      keywords:"μηκος κυματος περιοδος ταχυτητα συχνοτητα λ" },
    { category:"Κύματα", name:"Εξίσωση αρμονικού κύματος", formula:"y = A·ημ 2π(t/T − x/λ)",
      symbols:"y: απομάκρυνση, A: πλάτος, t: χρόνος, T: περίοδος, x: θέση, λ: μήκος κύματος", unit:"y, A σε m",
      keywords:"εξισωση κυματος αρμονικο πλατος φαση τρεχον διαδιδομενο" },

    /* ── ΡΕΥΣΤΑ ─────────────────────────────────── */
    { category:"Ρευστά", name:"Πυκνότητα", formula:"ρ = m / V",
      symbols:"ρ: πυκνότητα, m: μάζα, V: όγκος", unit:"ρ σε kg/m³",
      keywords:"πυκνοτητα μαζα ογκος ρευστα ρο" },
    { category:"Ρευστά", name:"Πίεση", formula:"P = F / A",
      symbols:"P: πίεση, F: κάθετη δύναμη, A: εμβαδόν επιφάνειας", unit:"P σε Pa (Pascal)",

    { category:"Ρευστά", name:"Υδροστατική πίεση", formula:"P = ρ·g·h",
      symbols:"P: πίεση υγρού, ρ: πυκνότητα, g: επιτάχυνση βαρύτητας, h: βάθος", unit:"P σε Pa",
      keywords:"υδροστατικη πιεση υγρο βαθος πυκνοτητα ρευστα" },
    { category:"Ρευστά", name:"Άνωση (Αρχιμήδης)", formula:"A = ρ_υγ·g·V_βυθ",
      symbols:"A: άνωση, ρ_υγ: πυκνότητα υγρού, g: επιτάχυνση βαρύτητας, V_βυθ: όγκος βυθισμένου σώματος", unit:"A σε N",
      keywords:"ανωση αρχιμηδης υγρο πυκνοτητα ογκος βυθισμενο ρευστα" },

    /* ── ΘΕΡΜΟΤΗΤΑ ──────────────────────────────── */
    { category:"Θερμότητα", name:"Θερμότητα (αισθητή)", formula:"Q = m·c·Δθ",
      symbols:"Q: θερμότητα, m: μάζα, c: ειδική θερμότητα, Δθ: μεταβολή θερμοκρασίας", unit:"Q σε J, c σε J/(kg·K)",
      keywords:"θερμοτητα ειδικη μαζα θερμοκρασια μεταβολη αισθητη" },
    { category:"Θερμότητα", name:"Λανθάνουσα θερμότητα", formula:"Q = m·L",
      symbols:"Q: θερμότητα αλλαγής κατάστασης, m: μάζα, L: λανθάνουσα θερμότητα", unit:"Q σε J, L σε J/kg",
      keywords:"λανθανουσα θερμοτητα τηξη βρασμος αλλαγη κατασταση μαζα" },
    { category:"Θερμότητα", name:"Θερμική διαστολή (γραμμική)", formula:"ΔL = α·L₀·Δθ",
      symbols:"ΔL: μεταβολή μήκους, α: συντελεστής διαστολής, L₀: αρχικό μήκος, Δθ: μεταβολή θερμοκρασίας", unit:"ΔL σε m",
      keywords:"θερμικη διαστολη γραμμικη μηκος συντελεστης θερμοκρασια" },
    { category:"Θερμότητα", name:"Καταστατική εξίσωση αερίων", formula:"P·V = n·R·T",
      symbols:"P: πίεση, V: όγκος, n: mol, R: παγκόσμια σταθ. αερίων ≈ 8,314 J/(mol·K), T: απόλυτη θερμοκρασία", unit:"T σε K",
      keywords:"καταστατικη ιδανικο αεριο πιεση ογκος γραμμομορια σταθερα R θερμοκρασια" },

    /* ── ΗΛΕΚΤΡΙΣΜΟΣ ────────────────────────────── */
    { category:"Ηλεκτρισμός", name:"Νόμος του Coulomb", formula:"F = k·q₁·q₂ / r²",
      symbols:"F: δύναμη, k: σταθερά Coulomb ≈ 9·10⁹ N·m²/C², q₁,q₂: φορτία, r: απόσταση", unit:"F σε N, q σε C",
      keywords:"κουλομπ coulomb φορτιο δυναμη ηλεκτρικη αποσταση σταθερα" },
    { category:"Ηλεκτρισμός", name:"Ένταση ρεύματος", formula:"I = q / t",
      symbols:"I: ένταση ρεύματος, q: φορτίο, t: χρόνος", unit:"I σε A (Ampere), q σε C",
      keywords:"ενταση ρευματος φορτιο χρονος αμπερ" },
    { category:"Ηλεκτρισμός", name:"Νόμος του Ohm", formula:"V = I·R",
      symbols:"V: τάση, I: ένταση ρεύματος, R: αντίσταση", unit:"V σε V (Volt), R σε Ω (Ohm)",
      keywords:"ωμ ohm ταση ενταση αντισταση νομος βολτ" },
    { category:"Ηλεκτρισμός", name:"Αντίσταση αγωγού", formula:"R = ρ·ℓ / A",
      symbols:"R: αντίσταση, ρ: ειδική αντίσταση υλικού, ℓ: μήκος αγωγού, A: εμβαδόν διατομής", unit:"R σε Ω, ρ σε Ω·m",
      keywords:"αντισταση αγωγος ειδικη μηκος διατομη εμβαδον ρο" },
    { category:"Ηλεκτρισμός", name:"Αντιστάσεις σε σειρά", formula:"R_ολ = R₁ + R₂ + …",
      symbols:"R_ολ: ολική αντίσταση, R₁,R₂…: επιμέρους αντιστάσεις σε σειρά", unit:"R σε Ω",
      keywords:"αντιστασεις σειρα ολικη συνδεση ισοδυναμη" },
    { category:"Ηλεκτρισμός", name:"Αντιστάσεις παράλληλα", formula:"1/R_ολ = 1/R₁ + 1/R₂ + …",
      symbols:"R_ολ: ολική αντίσταση, R₁,R₂…: επιμέρους αντιστάσεις παράλληλα", unit:"R σε Ω",
      keywords:"αντιστασεις παραλληλα ολικη συνδεση ισοδυναμη αντιστροφο" },
    { category:"Ηλεκτρισμός", name:"Ηλεκτρική ισχύς", formula:"P = V·I = I²·R = V²/R",
      symbols:"P: ισχύς, V: τάση, I: ένταση, R: αντίσταση", unit:"P σε W",
      keywords:"ηλεκτρικη ισχυς ταση ενταση αντισταση καταναλωση watt" },
    { category:"Ηλεκτρισμός", name:"Νόμος του Joule (θερμότητα)", formula:"Q = I²·R·t",
      symbols:"Q: θερμότητα, I: ένταση, R: αντίσταση, t: χρόνος", unit:"Q σε J",
      keywords:"τζουλ joule θερμοτητα ρευμα αντισταση φαινομενο" },
    { category:"Ηλεκτρισμός", name:"Ηλεκτρική ενέργεια", formula:"W = P·t = V·I·t",
      symbols:"W: ενέργεια, P: ισχύς, V: τάση, I: ένταση, t: χρόνος", unit:"W σε J (ή kWh)",
      keywords:"ηλεκτρικη ενεργεια ισχυς χρονος καταναλωση kwh" },
    { category:"Ηλεκτρισμός", name:"Χωρητικότητα πυκνωτή", formula:"C = Q / V",
      symbols:"C: χωρητικότητα, Q: φορτίο, V: τάση", unit:"C σε F (Farad), Q σε C",
      keywords:"χωρητικοτητα πυκνωτης φορτιο ταση φαραντ" },
    { category:"Ηλεκτρισμός", name:"Ένταση ηλεκτρικού πεδίου", formula:"E = F / q",
      symbols:"E: ένταση πεδίου, F: δύναμη στο φορτίο, q: δοκιμαστικό φορτίο", unit:"E σε N/C (ή V/m)",
      keywords:"ενταση ηλεκτρικου πεδιου δυναμη φορτιο" },

    /* ── ΗΛΕΚΤΡΟΜΑΓΝΗΤΙΣΜΟΣ ─────────────────────── */
    { category:"Ηλεκτρομαγνητισμός", name:"Δύναμη Laplace (αγωγός)", formula:"F = B·I·ℓ·ημφ",
      symbols:"F: δύναμη, B: μαγνητική επαγωγή, I: ένταση, ℓ: μήκος αγωγού, φ: γωνία I–B", unit:"F σε N, B σε T (Tesla)",
      keywords:"λαπλας laplace μαγνητικη δυναμη αγωγος ρευμα πεδιο" },
    { category:"Ηλεκτρομαγνητισμός", name:"Δύναμη Lorentz (φορτίο)", formula:"F = B·q·u·ημφ",
      symbols:"F: δύναμη, B: μαγνητική επαγωγή, q: φορτίο, u: ταχύτητα, φ: γωνία u–B", unit:"F σε N",
      keywords:"λορεντζ lorentz μαγνητικη δυναμη φορτιο κινουμενο πεδιο" },
    { category:"Ηλεκτρομαγνητισμός", name:"Μαγνητική ροή", formula:"Φ = B·A·συνθ",
      symbols:"Φ: μαγνητική ροή, B: μαγνητική επαγωγή, A: εμβαδόν, θ: γωνία B–κάθετης επιφάνειας", unit:"Φ σε Wb (Weber)",
      keywords:"μαγνητικη ροη επαγωγη εμβαδον γωνια βεμπερ" },
    { category:"Ηλεκτρομαγνητισμός", name:"Νόμος επαγωγής Faraday", formula:"ΕΗΔ = −ΔΦ / Δt",
      symbols:"ΕΗΔ: ηλεκτρεγερτική δύναμη, ΔΦ: μεταβολή μαγνητικής ροής, Δt: χρόνος", unit:"ΕΗΔ σε V",
      keywords:"φαραντεϊ faraday επαγωγη ηλεκτρεγερτικη ροη μεταβολη lenz" }
  ];

  /* ============================================================
     ΒΟΗΘΗΤΙΚΑ — normalize για αναζήτηση χωρίς τόνους
     ============================================================ */

  /** Αφαιρεί τόνους/διαλυτικά και μετατρέπει σε πεζά (accent-insensitive). */
  function normalize(str){
    return (str || "")
      .toLowerCase()
      .normalize("NFD")                 // διασπά γράμμα + τόνο
      .replace(/[̀-ͯ]/g, "")  // αφαιρεί τα διακριτικά
      .replace(/ς/g, "σ");              // τελικό σίγμα -> σίγμα
  }

  /** Προ-υπολογισμένο πεδίο αναζήτησης για κάθε τύπο. */
  FORMULAS.forEach(f => {
    f._search = normalize([f.name, f.formula, f.symbols, f.keywords, f.category].join(" "));
  });

  /* Μοναδικές κατηγορίες, με τη σειρά εμφάνισης στα δεδομένα. */
  const CATEGORIES = [...new Set(FORMULAS.map(f => f.category))];

  /* ============================================================
     ΚΑΤΑΣΤΑΣΗ (state) εφαρμογής
     ============================================================ */
  const state = { query: "", category: "Όλες" };

  /* ============================================================
     DOM αναφορές
     ============================================================ */
  const els = {
    search:   document.getElementById("search"),
    clearBtn: document.getElementById("clearBtn"),
    chips:    document.getElementById("chips"),
    cards:    document.getElementById("cards"),
    count:    document.getElementById("count"),
    empty:    document.getElementById("empty")
  };

  /* ============================================================
     RENDER — chips κατηγοριών
     ============================================================ */
  function renderChips(){
    const all = ["Όλες", ...CATEGORIES];
    els.chips.innerHTML = "";
    all.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "chip" + (cat === state.category ? " active" : "");
      btn.textContent = cat;
      btn.type = "button";
      btn.addEventListener("click", () => {
        state.category = cat;
        renderChips();
        render();
      });
      els.chips.appendChild(btn);
    });
  }

  /* ============================================================
     FILTER — εφαρμόζει αναζήτηση + κατηγορία
     ============================================================ */
  function getFiltered(){
    const q = normalize(state.query.trim());
    return FORMULAS.filter(f => {
      const catOK = state.category === "Όλες" || f.category === state.category;
      const qOK   = q === "" || f._search.includes(q);
      return catOK && qOK;
    });
  }

  /* ============================================================
     RENDER — κάρτες τύπων
     ============================================================ */
  function buildCard(f){
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML =
      '<div class="card-cat"></div>' +
      '<div class="card-name"></div>' +
      '<div class="card-formula"></div>' +
      '<div class="card-symbols"></div>' +
      '<div class="card-unit"><b></b></div>';
    // textContent παντού -> καθαρή απόδοση, χωρίς κίνδυνο HTML injection
    card.querySelector(".card-cat").textContent     = f.category;
    card.querySelector(".card-name").textContent    = f.name;
    card.querySelector(".card-formula").textContent = f.formula;
    card.querySelector(".card-symbols").textContent = f.symbols;
    card.querySelector(".card-unit b").textContent  = "Μονάδες: " + f.unit;
    return card;
  }

  function render(){
    const list = getFiltered();

    // καθάρισμα
    els.cards.innerHTML = "";

    if (list.length === 0){
      els.empty.classList.add("show");
      els.count.textContent = "";
      return;
    }
    els.empty.classList.remove("show");

    // μετρητής αποτελεσμάτων
    els.count.textContent = list.length + (list.length === 1 ? " τύπος" : " τύποι");

    // απόδοση καρτών (μέσω fragment για ταχύτητα)
    const frag = document.createDocumentFragment();
    list.forEach(f => frag.appendChild(buildCard(f)));
    els.cards.appendChild(frag);
  }

  /* ============================================================
     EVENTS
     ============================================================ */
  els.search.addEventListener("input", e => {
    state.query = e.target.value;
    els.clearBtn.classList.toggle("show", state.query.length > 0);
    render();
  });

  els.clearBtn.addEventListener("click", () => {
    state.query = "";
    els.search.value = "";
    els.clearBtn.classList.remove("show");
    els.search.focus();
    render();
  });

  /* ============================================================
     INIT
     ============================================================ */
  renderChips();
  render();
  </script>
</body>
</html>
