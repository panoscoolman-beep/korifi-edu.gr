<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#060d1b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Νόμος του Ωμ V=I·R και ισχύς P — δώσε δύο μεγέθη και βρες τα υπόλοιπα. Φροντιστήριο Κορυφή.">
  <title>Νόμος του Ωμ — Φροντιστήριο Κορυφή</title>
  <style>
    :root{ --bg:#060d1b; --bg2:#0b1a30; --bg3:#0f2040; --text:#c8d8e8; --dim:#2a5080; --border:#1a3050; --accent:#7ec8e3; }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{background:var(--bg);color:var(--text);font-family:'Courier New',Courier,monospace;min-height:100dvh;}

    /* ---- back-link bar ---- */
    .toolbar{max-width:520px;margin:0 auto;padding:10px 12px 0;}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;color:var(--dim);text-decoration:none;text-transform:uppercase;padding:6px 10px;border:1px solid var(--border);border-radius:20px;transition:color .15s,border-color .15s;}
    .back-link:hover,.back-link:active{color:#7ec8e3;border-color:#7ec8e3;}

    /* ---- layout ---- */
    .wrap{max-width:520px;margin:0 auto;padding:0 12px 40px;}
    .hdr{text-align:center;margin:14px 0 18px;}
    .hdr-sub{font-size:8px;letter-spacing:.35em;color:var(--dim);margin-bottom:4px;}
    .hdr-title{font-size:20px;font-weight:bold;letter-spacing:.13em;color:var(--accent);text-transform:uppercase;line-height:1.3;}

    .card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
    .card-lbl{font-size:8px;letter-spacing:.25em;color:var(--dim);text-transform:uppercase;margin-bottom:12px;}

    /* ---- input grid ---- */
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .field{display:flex;flex-direction:column;gap:6px;}
    .field-top{display:flex;align-items:baseline;justify-content:space-between;}
    .field-sym{color:var(--accent);font-weight:bold;font-size:15px;letter-spacing:.05em;}
    .field-unit{font-size:9px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;}
    .field-name{font-size:9px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:-2px;}
    .field input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);
      padding:11px 12px;font-size:17px;font-family:inherit;width:100%;outline:none;transition:border-color .15s,color .15s;
      -moz-appearance:textfield;}
    .field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
    .field input:focus{border-color:var(--accent);color:var(--accent);}
    .field input.computed{border-color:var(--dim);color:var(--accent);background:#091529;}
    .field.locked .field-sym{color:var(--accent);}

    /* ---- buttons ---- */
    .btn-row{display:flex;gap:10px;margin-top:4px;}
    .btn{flex:1;font-family:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
      padding:13px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);
      transition:color .15s,border-color .15s,background .15s;}
    .btn:hover,.btn:focus{color:var(--accent);border-color:var(--accent);outline:none;}
    .btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:bold;}
    .btn-primary:hover,.btn-primary:focus{background:#9ad6ec;color:var(--bg);border-color:#9ad6ec;}

    /* ---- note / validation ---- */
    .note{margin-top:12px;font-size:11px;line-height:1.5;color:var(--dim);letter-spacing:.03em;min-height:1.5em;}
    .note.warn{color:#e3a87e;}
    .note.ok{color:var(--accent);}

    /* ---- results ---- */
    .results{display:none;}
    .results.show{display:block;}
    .res-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
      padding:11px 0;border-bottom:1px dotted var(--border);}
    .res-row:last-child{border-bottom:none;}
    .res-left{display:flex;align-items:baseline;gap:8px;min-width:0;}
    .res-sym{color:var(--accent);font-weight:bold;font-size:15px;width:1.4em;flex-shrink:0;}
    .res-formula{font-size:11px;color:var(--dim);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .res-val{font-size:18px;color:var(--accent);font-weight:bold;letter-spacing:-.3px;white-space:nowrap;flex-shrink:0;}
    .res-val .u{font-size:11px;color:var(--dim);font-weight:normal;margin-left:3px;}
    .res-row.given .res-val{color:var(--text);}
    .res-tag{font-size:8px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;}

    /* ---- diagrams ---- */
    .diagrams{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
    .diagram{flex:1;min-width:130px;text-align:center;}
    .diagram svg{width:100%;height:auto;max-width:170px;}
    .diagram-cap{font-size:8px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-top:6px;}

    .footnote{text-align:center;font-size:9px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;margin-top:22px;}

    @media (max-width:360px){
      .grid{grid-template-columns:1fr;}
      .hdr-title{font-size:17px;}
    }
  </style>
</head>
<body>
  <div class="toolbar"><a class="back-link" href="/ergaleia">← Εργαλεία</a></div>

  <div class="wrap">
    <div class="hdr">
      <div class="hdr-sub">ΔΙΑΔΡΑΣΤΙΚΟ</div>
      <h1 class="hdr-title">Νόμος του Ωμ</h1>
    </div>

    <!-- ====== INPUTS ====== -->
    <div class="card">
      <div class="card-lbl">Δώσε ΔΥΟ μεγέθη</div>
      <div class="grid">
        <div class="field" id="field-V">
          <div class="field-top"><span class="field-sym">V</span><span class="field-unit">Volt</span></div>
          <div class="field-name">Τάση</div>
          <input type="number" id="in-V" inputmode="decimal" step="any" placeholder="0" aria-label="Τάση σε Volt">
        </div>
        <div class="field" id="field-I">
          <div class="field-top"><span class="field-sym">I</span><span class="field-unit">Ampere</span></div>
          <div class="field-name">Ένταση</div>
          <input type="number" id="in-I" inputmode="decimal" step="any" placeholder="0" aria-label="Ένταση σε Ampere">
        </div>
        <div class="field" id="field-R">
          <div class="field-top"><span class="field-sym">R</span><span class="field-unit">Ohm (Ω)</span></div>
          <div class="field-name">Αντίσταση</div>
          <input type="number" id="in-R" inputmode="decimal" step="any" placeholder="0" aria-label="Αντίσταση σε Ohm">
        </div>
        <div class="field" id="field-P">
          <div class="field-top"><span class="field-sym">P</span><span class="field-unit">Watt</span></div>
          <div class="field-name">Ισχύς</div>
          <input type="number" id="in-P" inputmode="decimal" step="any" placeholder="0" aria-label="Ισχύς σε Watt">
        </div>
      </div>

      <div class="btn-row" style="margin-top:14px;">
        <button class="btn btn-primary" id="btn-calc" type="button">Υπολογισμός</button>
        <button class="btn" id="btn-clear" type="button">Καθαρισμός</button>
      </div>

      <div class="note" id="note" role="status" aria-live="polite">Συμπλήρωσε ακριβώς δύο πεδία.</div>
    </div>

    <!-- ====== RESULTS ====== -->
    <div class="card results" id="results">
      <div class="card-lbl">Αποτελέσματα &amp; τύποι</div>
      <div id="res-rows"></div>
    </div>

    <!-- ====== DIAGRAMS ====== -->
    <div class="card">
      <div class="card-lbl">Μνημονικά</div>
      <div class="diagrams">
        <!-- Ohm triangle: V over I · R -->
        <div class="diagram">
          <svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Τρίγωνο νόμου του Ωμ: V πάνω από I και R">
            <polygon points="60,8 112,100 8,100" fill="none" stroke="#1a3050" stroke-width="2"/>
            <line x1="8" y1="60" x2="112" y2="60" stroke="#1a3050" stroke-width="2"/>
            <text x="60" y="44" text-anchor="middle" font-family="Courier New, monospace" font-size="26" font-weight="bold" fill="#7ec8e3">V</text>
            <text x="38" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="bold" fill="#c8d8e8">I</text>
            <text x="60" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="#2a5080">·</text>
            <text x="82" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="bold" fill="#c8d8e8">R</text>
          </svg>
          <div class="diagram-cap">V = I · R</div>
        </div>
        <!-- Power triangle: P over V · I -->
        <div class="diagram">
          <svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Τρίγωνο ισχύος: P πάνω από V και I">
            <polygon points="60,8 112,100 8,100" fill="none" stroke="#1a3050" stroke-width="2"/>
            <line x1="8" y1="60" x2="112" y2="60" stroke="#1a3050" stroke-width="2"/>
            <text x="60" y="44" text-anchor="middle" font-family="Courier New, monospace" font-size="26" font-weight="bold" fill="#7ec8e3">P</text>
            <text x="38" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="bold" fill="#c8d8e8">V</text>
            <text x="60" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="#2a5080">·</text>
            <text x="82" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="bold" fill="#c8d8e8">I</text>
          </svg>
          <div class="diagram-cap">P = V · I</div>
        </div>
      </div>
    </div>

    <div class="footnote">Φροντιστήριο Κορυφή</div>
  </div>

  <script>
  "use strict";

  /* ============================================================
   * CORE COMPUTE — top-level, pure, testable.
   *
   * computeOhm(input): input has any TWO of {V,I,R,P} (numbers),
   * the rest null/undefined. Returns {V,I,R,P} all filled, plus a
   * `_formulas` map describing how each MISSING quantity was derived.
   *
   * Relations used:
   *   V = I·R        P = V·I = I²·R = V²/R
   * From any valid pair we first resolve the "electrical core"
   * (V, I, R) so that V = I·R holds, then P = V·I.
   *
   * Throws Error (Greek message) on: wrong count of inputs,
   * non-positive divisor / sqrt of negative, etc.
   * ============================================================ */
  function computeOhm(input) {
    input = input || {};

    // Normalise: keep only finite numbers among the four knowns.
    var keys = ["V", "I", "R", "P"];
    var given = {};
    keys.forEach(function (k) {
      var v = input[k];
      if (v !== null && v !== undefined && v !== "" && isFinite(Number(v))) {
        given[k] = Number(v);
      }
    });

    var provided = Object.keys(given);
    if (provided.length !== 2) {
      throw new Error("Χρειάζονται ακριβώς δύο μεγέθη (έδωσες " + provided.length + ").");
    }

    var V = given.V, I = given.I, R = given.R, P = given.P;
    var f = {}; // formulas for derived values

    // Helper guards
    function need(cond, msg) { if (!cond) throw new Error(msg); }

    var has = function (k) { return given.hasOwnProperty(k); };
    var pair = provided.slice().sort().join("");

    switch (pair) {
      // ---- V & I ----
      case "IV":
        R = V / I;        f.R = "R = V / I";
        P = V * I;        f.P = "P = V · I";
        need(I !== 0, "Η ένταση I δεν μπορεί να είναι 0 για να βρεθεί η αντίσταση R.");
        break;

      // ---- I & R ----
      case "IR":
        V = I * R;        f.V = "V = I · R";
        P = I * I * R;     f.P = "P = I² · R";
        break;

      // ---- V & R ----
      case "RV":
        need(R !== 0, "Η αντίσταση R δεν μπορεί να είναι 0 για να βρεθεί η ένταση I.");
        I = V / R;        f.I = "I = V / R";
        P = (V * V) / R;  f.P = "P = V² / R";
        break;

      // ---- V & P ----
      case "PV":
        need(V !== 0, "Η τάση V δεν μπορεί να είναι 0 για να βρεθεί η ένταση I.");
        I = P / V;        f.I = "I = P / V";
        R = (V * V) / P;  f.R = "R = V² / P";
        need(P !== 0, "Η ισχύς P δεν μπορεί να είναι 0 για να βρεθεί η αντίσταση R.");
        break;

      // ---- I & P ----
      case "IP":
        need(I !== 0, "Η ένταση I δεν μπορεί να είναι 0 για να βρεθούν τα V και R.");
        V = P / I;        f.V = "V = P / I";
        R = P / (I * I);  f.R = "R = P / I²";
        break;

      // ---- R & P ----
      case "PR":
        need(R > 0, "Η αντίσταση R πρέπει να είναι θετική για P = I²·R.");
        need(P >= 0, "Η ισχύς P δεν μπορεί να είναι αρνητική.");
        I = Math.sqrt(P / R);   f.I = "I = √(P / R)";
        V = I * R;              f.V = "V = I · R";
        break;

      default:
        throw new Error("Μη υποστηριζόμενος συνδυασμός μεγεθών.");
    }

    return { V: V, I: I, R: R, P: P, _formulas: f, _given: provided };
  }

  /* ============================================================
   * FORMATTING — up to 4 significant digits, clean display.
   * ============================================================ */
  function fmt(x) {
    if (x === null || x === undefined || !isFinite(x)) return "—";
    if (x === 0) return "0";
    // 4 significant digits, then strip trailing zeros.
    var s = Number(x.toPrecision(4)).toString();
    return s;
  }

  /* ============================================================
   * UI WIRING (DOM-dependent; kept separate from core).
   * ============================================================ */
  var QTY = [
    { k: "V", unit: "V",  name: "Τάση" },
    { k: "I", unit: "A",  name: "Ένταση" },
    { k: "R", unit: "Ω",  name: "Αντίσταση" },
    { k: "P", unit: "W",  name: "Ισχύς" }
  ];

  var inputs = {
    V: document.getElementById("in-V"),
    I: document.getElementById("in-I"),
    R: document.getElementById("in-R"),
    P: document.getElementById("in-P")
  };
  var noteEl    = document.getElementById("note");
  var resultsEl = document.getElementById("results");
  var resRows   = document.getElementById("res-rows");

  /** Read current user-entered values (ignoring computed fills). */
  function readInputs() {
    var out = {};
    Object.keys(inputs).forEach(function (k) {
      var raw = inputs[k].value.trim();
      if (raw !== "") out[k] = Number(raw.replace(",", "."));
    });
    return out;
  }

  /** Set a friendly note with a style class. */
  function setNote(msg, kind) {
    noteEl.textContent = msg;
    noteEl.className = "note" + (kind ? " " + kind : "");
  }

  /** Clear computed-state styling on every input. */
  function clearComputedStyles() {
    Object.keys(inputs).forEach(function (k) {
      inputs[k].classList.remove("computed");
      document.getElementById("field-" + k).classList.remove("locked");
    });
  }

  /** Render the results card from a computeOhm() result. */
  function renderResults(res) {
    resRows.innerHTML = "";
    QTY.forEach(function (q) {
      var isGiven = res._given.indexOf(q.k) !== -1;
      var formula = res._formulas[q.k] || "";
      var row = document.createElement("div");
      row.className = "res-row" + (isGiven ? " given" : "");

      var left = document.createElement("div");
      left.className = "res-left";
      var sym = document.createElement("span");
      sym.className = "res-sym";
      sym.textContent = q.k;
      var meta = document.createElement("span");
      meta.className = "res-formula";
      meta.textContent = isGiven ? "δοσμένο" : formula;
      left.appendChild(sym);
      left.appendChild(meta);

      var val = document.createElement("span");
      val.className = "res-val";
      val.innerHTML = fmt(res[q.k]) + ' <span class="u">' + q.unit + "</span>";

      row.appendChild(left);
      row.appendChild(val);
      resRows.appendChild(row);
    });
    resultsEl.classList.add("show");
  }

  /** Fill the missing input boxes with computed values (visual aid). */
  function fillComputed(res) {
    clearComputedStyles();
    QTY.forEach(function (q) {
      if (res._given.indexOf(q.k) !== -1) {
        document.getElementById("field-" + q.k).classList.add("locked");
      } else {
        inputs[q.k].value = fmt(res[q.k]);
        inputs[q.k].classList.add("computed");
      }
    });
  }

  /** Main calculate handler. */
  function calculate() {
    var data = readInputs();
    var n = Object.keys(data).length;

    if (n === 0) { setNote("Συμπλήρωσε ακριβώς δύο πεδία.", null); resultsEl.classList.remove("show"); return; }
    if (n === 1) { setNote("Δώσε ένα ακόμη μέγεθος (χρειάζονται δύο).", null); resultsEl.classList.remove("show"); return; }
    if (n > 2)  { setNote("Έδωσες " + n + " μεγέθη — άφησε μόνο δύο.", "warn"); resultsEl.classList.remove("show"); return; }

    try {
      var res = computeOhm(data);
      renderResults(res);
      fillComputed(res);
      setNote("Υπολογίστηκε. ✓", "ok");
    } catch (err) {
      resultsEl.classList.remove("show");
      clearComputedStyles();
      setNote(err.message, "warn");
    }
  }

  /** Reset everything. */
  function clearAll() {
    Object.keys(inputs).forEach(function (k) { inputs[k].value = ""; });
    clearComputedStyles();
    resultsEl.classList.remove("show");
    resRows.innerHTML = "";
    setNote("Συμπλήρωσε ακριβώς δύο πεδία.", null);
    inputs.V.focus();
  }

  /* ---- events ---- */
  document.getElementById("btn-calc").addEventListener("click", calculate);
  document.getElementById("btn-clear").addEventListener("click", clearAll);

  Object.keys(inputs).forEach(function (k) {
    var el = inputs[k];
    // When a user edits a field, drop computed styling so the two real
    // inputs are always the source of truth, then live-recompute.
    el.addEventListener("input", function () {
      if (el.classList.contains("computed")) {
        el.classList.remove("computed");
      }
      // Live compute only when exactly two non-computed fields hold values.
      var liveCount = 0;
      Object.keys(inputs).forEach(function (kk) {
        if (inputs[kk].value.trim() !== "" && !inputs[kk].classList.contains("computed")) liveCount++;
      });
      if (liveCount === 2) calculate();
      else if (liveCount < 2) { resultsEl.classList.remove("show"); clearComputedStyles(); setNote(liveCount === 1 ? "Δώσε ένα ακόμη μέγεθος (χρειάζονται δύο)." : "Συμπλήρωσε ακριβώς δύο πεδία.", null); }
    });
    // Enter triggers a full calculate.
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); calculate(); }
    });
  });

  /* ============================================================
   * SELF-TEST — runs on load, logs PASS/FAIL to console only.
   * (No UI impact; helps catch regressions.)
   * ============================================================ */
  (function runSelfTest() {
    var cases = [
      { in: { I: 2, R: 3 },   exp: { V: 6, P: 12 } },
      { in: { V: 12, R: 4 },  exp: { I: 3, P: 36 } },
      { in: { V: 10, I: 2 },  exp: { R: 5, P: 20 } },
      { in: { P: 100, R: 4 }, exp: { I: 5, V: 20 } },
      { in: { P: 60, V: 12 }, exp: { I: 5, R: 2.4 } },
      { in: { P: 18, I: 3 },  exp: { V: 6, R: 2 } }
    ];
    var ok = true;
    cases.forEach(function (c, i) {
      try {
        var r = computeOhm(c.in);
        Object.keys(c.exp).forEach(function (k) {
          if (Math.abs(r[k] - c.exp[k]) > 1e-9) {
            ok = false;
            console.error("computeOhm test " + (i + 1) + " FAIL: " + k + "=" + r[k] + " expected " + c.exp[k]);
          }
        });
      } catch (e) {
        ok = false;
        console.error("computeOhm test " + (i + 1) + " threw:", e.message);
      }
    });
    console.log(ok ? "computeOhm: all self-tests PASS" : "computeOhm: self-tests FAILED");
  })();
  </script>
</body>
</html>
