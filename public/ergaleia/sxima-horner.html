<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<meta name="theme-color" content="#060d1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Σχήμα Horner — διαίρεση πολυωνύμου με x−ρ, βήμα-βήμα, υπόλοιπο και τιμή πολυωνύμου. Φροντιστήριο Κορυφή.">
<title>Σχήμα Horner — Φροντιστήριο Κορυφή</title>
<style>
:root{ --bg:#060d1b; --bg2:#0b1a30; --bg3:#0f2040; --text:#c8d8e8; --dim:#2a5080; --border:#1a3050; --accent:#7ec8e3; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'Courier New',Courier,monospace;min-height:100dvh;}

/* ---------- layout ---------- */
.toolbar{max-width:600px;margin:0 auto;padding:10px 12px 0;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;color:var(--dim);text-decoration:none;text-transform:uppercase;padding:6px 10px;border:1px solid var(--border);border-radius:20px;transition:color .15s,border-color .15s;}
.back-link:hover,.back-link:active{color:#7ec8e3;border-color:#7ec8e3;}

.wrap{max-width:600px;margin:0 auto;padding:14px 12px 60px;}

header{text-align:center;margin:18px 0 26px;}
.eyebrow{font-size:10px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase;}
h1{font-size:clamp(26px,8vw,40px);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-top:8px;font-weight:bold;}

/* ---------- card ---------- */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.card h2{font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:12px;font-weight:bold;}

label{display:block;font-size:12px;color:var(--text);margin-bottom:6px;letter-spacing:.04em;}
.hint{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5;}

input[type=text]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:inherit;font-size:16px;letter-spacing:.04em;transition:border-color .15s;}
input[type=text]:focus{outline:none;border-color:var(--accent);}

.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.row .field{flex:1 1 160px;min-width:120px;}
.field-rho{flex:0 1 120px;}

button{font-family:inherit;cursor:pointer;}
.btn-calc{width:100%;background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:14px;font-size:14px;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;transition:opacity .15s,transform .05s;}
.btn-calc:hover{opacity:.9;}
.btn-calc:active{transform:scale(.99);}

/* ---------- examples chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.chip{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:8px 12px;font-size:12px;font-family:inherit;letter-spacing:.02em;transition:border-color .15s,color .15s;}
.chip:hover,.chip:active{border-color:var(--accent);color:var(--accent);}

/* ---------- error ---------- */
.error{background:rgba(120,30,40,.25);border:1px solid #6e2030;color:#f0b8c0;border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:16px;}

/* ---------- horner table ---------- */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px;}
table.horner{border-collapse:collapse;margin:0 auto;font-size:15px;min-width:100%;}
table.horner td{border:1px solid var(--border);padding:10px 14px;text-align:center;min-width:48px;white-space:nowrap;}
table.horner td.rowlabel{color:var(--dim);font-size:11px;letter-spacing:.06em;text-align:right;border:none;padding-right:12px;}
table.horner td.rho-cell{color:var(--accent);font-weight:bold;border:none;border-left:2px solid var(--accent);padding-left:14px;}
table.horner tr.coeffs td{color:var(--text);}
table.horner tr.products td{color:var(--dim);}
table.horner tr.sums td{color:var(--accent);font-weight:bold;border-top:2px solid var(--dim);}
table.horner td.remainder{background:rgba(126,200,227,.16);border:2px solid var(--accent);color:var(--accent);}
table.horner td.blank{border:none;}

/* ---------- results ---------- */
.results{margin-top:4px;}
.result-line{font-size:15px;line-height:1.7;margin-bottom:10px;}
.result-line .lbl{color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px;}
.result-line .val{color:var(--accent);font-size:18px;font-weight:bold;}
.note{font-size:13px;color:var(--text);line-height:1.6;margin-top:10px;padding:10px 12px;background:var(--bg3);border-left:3px solid var(--dim);border-radius:0 6px 6px 0;}
.note.root{border-left-color:var(--accent);color:var(--accent);}

/* ---------- steps narration ---------- */
.steps{margin-top:6px;}
.steps li{list-style:none;font-size:13px;color:var(--text);line-height:1.6;margin-bottom:8px;padding-left:26px;position:relative;}
.steps li::before{content:counter(step);counter-increment:step;position:absolute;left:0;top:0;width:18px;height:18px;line-height:18px;text-align:center;font-size:11px;color:var(--bg);background:var(--accent);border-radius:50%;}
.steps{counter-reset:step;}

.hidden{display:none;}
sup{font-size:.7em;}
</style>
</head>
<body>

<div class="toolbar"><a class="back-link" href="/ergaleia">← Εργαλεία</a></div>

<div class="wrap">

  <header>
    <div class="eyebrow">ΔΙΑΔΡΑΣΤΙΚΟ</div>
    <h1>Σχήμα Horner</h1>
  </header>

  <!-- ===== INPUT ===== -->
  <section class="card">
    <h2>Δεδομένα</h2>

    <div class="row">
      <div class="field">
        <label for="coeffs">Συντελεστές πολυωνύμου P(x)</label>
        <input type="text" id="coeffs" inputmode="text" autocomplete="off"
               aria-label="Συντελεστές πολυωνύμου" value="1 -6 11 -6">
        <div class="hint">Από τον μεγαλύτερο βαθμό προς τον σταθερό όρο,
          με κενό ή κόμμα. Συμπληρώστε <b>μηδενικά</b> για όρους που λείπουν.
          Π.χ. <b>1 -6 11 -6</b> → x³ − 6x² + 11x − 6.</div>
      </div>
      <div class="field field-rho">
        <label for="rho">ρ (διαιρέτης x − ρ)</label>
        <input type="text" id="rho" inputmode="text" autocomplete="off"
               aria-label="Τιμή ρ" value="1">
      </div>
    </div>

    <button class="btn-calc" id="calcBtn" type="button">Υπολογισμός</button>

    <div style="margin-top:16px;">
      <label>Γρήγορα παραδείγματα</label>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <!-- ===== ERROR ===== -->
  <div class="error hidden" id="errorBox" role="alert"></div>

  <!-- ===== TABLE ===== -->
  <section class="card hidden" id="tableCard">
    <h2>Πίνακας Horner</h2>
    <div class="table-scroll">
      <div id="tableHost"></div>
    </div>
  </section>

  <!-- ===== RESULTS ===== -->
  <section class="card hidden" id="resultCard">
    <h2>Αποτελέσματα</h2>
    <div class="results" id="resultHost"></div>
  </section>

  <!-- ===== STEPS ===== -->
  <section class="card hidden" id="stepsCard">
    <h2>Βήματα</h2>
    <ol class="steps" id="stepsHost"></ol>
  </section>

</div>

<script>
"use strict";

/* =========================================================================
   CORE MATH  (top-level, testable)
   ========================================================================= */

/**
 * Καθαρισμός αριθμού από floating-point "σκόνη" (π.χ. 5.9999999 -> 6).
 * Στρογγυλοποιεί σε ~10 σημαντικά δεκαδικά και μετά αφαιρεί το -0.
 * @param {number} n
 * @returns {number}
 */
function cleanNum(n){
  if(!isFinite(n)) return n;
  const r = Math.round(n * 1e10) / 1e10;
  return r === 0 ? 0 : r; // εξαλείφει το -0
}

/**
 * Συνθετική διαίρεση (σχήμα Horner) του πολυωνύμου με συντελεστές `coeffs`
 * (από μεγαλύτερο βαθμό προς σταθερό όρο) διά (x − r).
 * @param {number[]} coeffs - συντελεστές, μήκος >= 2
 * @param {number} r - η τιμή ρ
 * @returns {{quotient:number[], remainder:number}}
 *          quotient: συντελεστές πηλίκου (ένας βαθμός χαμηλότερα),
 *          remainder: το υπόλοιπο = P(r).
 */
function horner(coeffs, r){
  const sums = [];
  sums[0] = cleanNum(coeffs[0]);        // κατέβασμα πρώτου συντελεστή
  for(let i = 1; i < coeffs.length; i++){
    sums[i] = cleanNum(coeffs[i] + sums[i-1] * r);
  }
  const remainder = sums[sums.length - 1];   // το τελευταίο άθροισμα = P(r)
  const quotient = sums.slice(0, -1);        // οι υπόλοιποι = πηλίκο
  return { quotient: quotient, remainder: remainder };
}

/**
 * Τα "γινόμενα που κατεβαίνουν" στη μεσαία γραμμή του πίνακα Horner.
 * products[0] είναι κενό (δεν υπάρχει γινόμενο κάτω από τον πρώτο όρο).
 * @param {number[]} sums - η κάτω γραμμή (αθροίσματα)
 * @param {number} r
 * @returns {(number|null)[]}
 */
function hornerProducts(sums, r){
  const products = [null];
  for(let i = 0; i < sums.length - 1; i++){
    products.push(cleanNum(sums[i] * r));
  }
  return products;
}

/* =========================================================================
   PARSING & VALIDATION
   ========================================================================= */

/**
 * Μετατρέπει μια συμβολοσειρά συντελεστών σε πίνακα αριθμών.
 * Δέχεται κενά και/ή κόμματα ως διαχωριστικά.
 * @param {string} str
 * @returns {{ok:boolean, value?:number[], error?:string}}
 */
function parseCoeffs(str){
  const tokens = String(str).trim().split(/[\s,]+/).filter(t => t.length > 0);
  if(tokens.length < 2){
    return { ok:false, error:"Χρειάζονται τουλάχιστον 2 συντελεστές (π.χ. 1 -6 11 -6)." };
  }
  const nums = [];
  for(const t of tokens){
    const n = parseNumber(t);
    if(n === null){
      return { ok:false, error:'Μη έγκυρος συντελεστής: «' + t + '». Χρησιμοποιήστε μόνο αριθμούς.' };
    }
    nums.push(n);
  }
  return { ok:true, value:nums };
}

/**
 * Ασφαλής μετατροπή token σε αριθμό. Δέχεται και κόμμα ως δεκαδικό (3,5).
 * @param {string} t
 * @returns {number|null}
 */
function parseNumber(t){
  const cleaned = t.replace(",", ".");
  if(!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(cleaned)) return null;
  const n = Number(cleaned);
  return isFinite(n) ? n : null;
}

/* =========================================================================
   FORMATTING / PRETTY-PRINTING
   ========================================================================= */

/** Δείκτες εκθέτη σε μορφή superscript (Unicode). */
const SUPERSCRIPTS = {0:"⁰",1:"¹",2:"²",3:"³",4:"⁴",5:"⁵",6:"⁶",7:"⁷",8:"⁸",9:"⁹"};

/**
 * Μετατρέπει έναν ακέραιο εκθέτη σε superscript string (π.χ. 12 -> "¹²").
 * @param {number} e
 * @returns {string}
 */
function superscript(e){
  return String(e).split("").map(d => SUPERSCRIPTS[d] || d).join("");
}

/**
 * Μορφοποιεί έναν αριθμό για εμφάνιση (καθαρός, με σύμβολο μείον "−").
 * @param {number} n
 * @returns {string}
 */
function fmtNum(n){
  const c = cleanNum(n);
  return String(c).replace("-", "−");
}

/**
 * Όμορφη εκτύπωση πολυωνύμου από συντελεστές (μεγαλύτερος -> σταθερός όρος).
 * Χειρίζεται πρόσημα, συντελεστές 1/−1, x⁰/x¹ και μηδενικούς όρους.
 * @param {number[]} coeffs
 * @returns {string}  π.χ. "x² − 5x + 6"
 */
function formatPolynomial(coeffs){
  const deg = coeffs.length - 1;
  let out = "";
  for(let i = 0; i < coeffs.length; i++){
    const c = cleanNum(coeffs[i]);
    if(c === 0) continue;                 // παράλειψη μηδενικών όρων
    const power = deg - i;
    const abs = Math.abs(c);

    // πρόσημο / σύνδεσμος
    if(out === ""){
      if(c < 0) out += "−";
    } else {
      out += c < 0 ? " − " : " + ";
    }

    // συντελεστής (κρύβουμε το 1 εκτός αν είναι σταθερός όρος)
    const showCoeff = !(abs === 1 && power > 0);
    if(showCoeff) out += fmtAbs(abs);

    // μεταβλητή & εκθέτης
    if(power === 1)      out += "x";
    else if(power > 1)   out += "x" + superscript(power);
    // power === 0 -> τίποτα (μόνο ο αριθμός)
  }
  return out === "" ? "0" : out;
}

/** Μορφοποίηση θετικού/μηδενικού μεγέθους (χωρίς πρόσημο). */
function fmtAbs(abs){
  const c = cleanNum(abs);
  return String(c);
}

/* =========================================================================
   STEP NARRATION
   ========================================================================= */

/**
 * Παράγει σύντομη αφήγηση βημάτων στα ελληνικά.
 * @param {number[]} coeffs
 * @param {number} r
 * @param {number[]} sums
 * @param {(number|null)[]} products
 * @returns {string[]}
 */
function buildSteps(coeffs, r, sums, products){
  const rho = fmtNum(r);
  const steps = [];
  steps.push("Γράφουμε τους συντελεστές στην πρώτη γραμμή και το ρ = " + rho +
             " δεξιά.");
  steps.push("Κατεβάζουμε τον πρώτο συντελεστή " + fmtNum(coeffs[0]) +
             " αυτούσιο στην κάτω γραμμή.");

  // ένα αντιπροσωπευτικό βήμα πολλαπλασιασμού/πρόσθεσης
  if(coeffs.length >= 2){
    steps.push("Πολλαπλασιάζουμε το τελευταίο άθροισμα με το ρ: " +
               fmtNum(sums[0]) + " × " + rho + " = " + fmtNum(products[1]) +
               ", και το γράφουμε κάτω από τον επόμενο συντελεστή.");
    steps.push("Προσθέτουμε κατά στήλη: " + fmtNum(coeffs[1]) + " + " +
               fmtNum(products[1]) + " = " + fmtNum(sums[1]) + ".");
  }
  steps.push("Επαναλαμβάνουμε «πολλαπλασιασμός με ρ → πρόσθεση» μέχρι το τέλος.");
  steps.push("Το τελευταίο άθροισμα είναι το υπόλοιπο υ = " +
             fmtNum(sums[sums.length-1]) +
             " (= P(" + rho + ")). Τα προηγούμενα είναι οι συντελεστές του πηλίκου.");
  return steps;
}

/* =========================================================================
   RENDERING (DOM)
   ========================================================================= */

/** Στοιχεία UI. */
const els = {
  coeffs:   document.getElementById("coeffs"),
  rho:      document.getElementById("rho"),
  calcBtn:  document.getElementById("calcBtn"),
  chips:    document.getElementById("chips"),
  errorBox: document.getElementById("errorBox"),
  tableCard:document.getElementById("tableCard"),
  tableHost:document.getElementById("tableHost"),
  resultCard:document.getElementById("resultCard"),
  resultHost:document.getElementById("resultHost"),
  stepsCard:document.getElementById("stepsCard"),
  stepsHost:document.getElementById("stepsHost"),
};

/** Παραδείγματα (chips). */
const EXAMPLES = [
  { coeffs:"1 -6 11 -6", rho:"1"  },
  { coeffs:"1 0 -7 6",   rho:"2"  },
  { coeffs:"2 -3 0 5",   rho:"-1" },
  { coeffs:"1 1 1 1",    rho:"2"  },
];

/** Εμφάνιση μηνύματος λάθους και απόκρυψη αποτελεσμάτων. */
function showError(msg){
  els.errorBox.textContent = msg;
  els.errorBox.classList.remove("hidden");
  els.tableCard.classList.add("hidden");
  els.resultCard.classList.add("hidden");
  els.stepsCard.classList.add("hidden");
}

/** Καθάρισμα λάθους. */
function clearError(){
  els.errorBox.classList.add("hidden");
  els.errorBox.textContent = "";
}

/**
 * Δόμηση HTML του πίνακα Horner (3 γραμμές).
 * @param {number[]} coeffs
 * @param {number} r
 * @param {number[]} sums
 * @param {(number|null)[]} products
 * @returns {string}
 */
function renderTable(coeffs, r, sums, products){
  const n = coeffs.length;

  // Γραμμή 1: συντελεστές | ρ (το ρ δεξιά)
  let row1 = '';
  for(let i = 0; i < n; i++){
    row1 += '<td>' + fmtNum(coeffs[i]) + '</td>';
  }
  row1 += '<td class="rho-cell">' + fmtNum(r) + '</td>';

  // Γραμμή 2: γινόμενα (πρώτο κελί κενό) | (κενό κάτω από το ρ)
  let row2 = '';
  for(let i = 0; i < n; i++){
    row2 += (products[i] === null || products[i] === undefined)
      ? '<td class="blank"></td>'
      : '<td>' + fmtNum(products[i]) + '</td>';
  }
  row2 += '<td class="blank"></td>';

  // Γραμμή 3: αθροίσματα (τελευταίο συντελεστών = υπόλοιπο, highlight) | (κενό κάτω από το ρ)
  let row3 = '';
  for(let i = 0; i < n; i++){
    const isRem = (i === n - 1);
    row3 += '<td' + (isRem ? ' class="remainder"' : '') + '>' +
            fmtNum(sums[i]) + '</td>';
  }
  row3 += '<td class="blank"></td>';

  return '<table class="horner">' +
           '<tr class="coeffs">' + row1 + '</tr>' +
           '<tr class="products">' + row2 + '</tr>' +
           '<tr class="sums">' + row3 + '</tr>' +
         '</table>';
}

/**
 * Δόμηση HTML των αποτελεσμάτων (πηλίκο, υπόλοιπο, σημειώσεις).
 * @param {number[]} quotient
 * @param {number} remainder
 * @param {number} r
 * @returns {string}
 */
function renderResults(quotient, remainder, r){
  const rho = fmtNum(r);
  const qStr = formatPolynomial(quotient);
  let html = "";

  html += '<div class="result-line">' +
            '<span class="lbl">Πηλίκο Q(x)</span>' +
            '<span class="val">' + qStr + '</span>' +
          '</div>';

  html += '<div class="result-line">' +
            '<span class="lbl">Υπόλοιπο υ</span>' +
            '<span class="val">' + fmtNum(remainder) + '</span>' +
          '</div>';

  // Θεώρημα υπολοίπου
  html += '<div class="note">Θεώρημα υπολοίπου: P(ρ) = υ, δηλαδή P(' +
          rho + ') = ' + fmtNum(remainder) + '.</div>';

  // Ταυτότητα διαίρεσης
  html += '<div class="note">P(x) = (x − ' + rho + ')·(' + qStr + ')' +
          (cleanNum(remainder) === 0 ? '' : ' + ' + fmtNum(remainder)) + '</div>';

  // Ειδική περίπτωση ρίζας
  if(cleanNum(remainder) === 0){
    html += '<div class="note root">Το ρ = ' + rho +
            ' είναι ρίζα του πολυωνύμου· το (x − ' + rho +
            ') διαιρεί το P(x).</div>';
  }

  return html;
}

/** Δόμηση των βημάτων ως <li>. */
function renderSteps(steps){
  return steps.map(s => '<li>' + s + '</li>').join("");
}

/* =========================================================================
   ORCHESTRATION
   ========================================================================= */

/** Διαβάζει είσοδο, υπολογίζει και εμφανίζει τα πάντα. */
function calculate(){
  clearError();

  const parsed = parseCoeffs(els.coeffs.value);
  if(!parsed.ok){ showError(parsed.error); return; }

  const r = parseNumber(els.rho.value.trim());
  if(r === null){
    showError("Μη έγκυρη τιμή ρ. Δώστε έναν αριθμό (π.χ. 1, -2, 0.5).");
    return;
  }

  const coeffs = parsed.value;
  const { quotient, remainder } = horner(coeffs, r);
  const sums = quotient.concat([remainder]);     // πλήρης κάτω γραμμή
  const products = hornerProducts(sums, r);

  // Render
  els.tableHost.innerHTML  = renderTable(coeffs, r, sums, products);
  els.resultHost.innerHTML = renderResults(quotient, remainder, r);
  els.stepsHost.innerHTML  = renderSteps(buildSteps(coeffs, r, sums, products));

  els.tableCard.classList.remove("hidden");
  els.resultCard.classList.remove("hidden");
  els.stepsCard.classList.remove("hidden");
}

/** Δημιουργία των chip-παραδειγμάτων. */
function buildChips(){
  EXAMPLES.forEach(ex => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = ex.coeffs + " | ρ=" + ex.rho;
    b.addEventListener("click", () => {
      els.coeffs.value = ex.coeffs;
      els.rho.value = ex.rho;
      calculate();
      els.tableCard.scrollIntoView({ behavior:"smooth", block:"nearest" });
    });
    els.chips.appendChild(b);
  });
}

/* =========================================================================
   EVENT WIRING (top-level)
   ========================================================================= */

els.calcBtn.addEventListener("click", calculate);

// Enter σε οποιοδήποτε πεδίο -> υπολογισμός
[els.coeffs, els.rho].forEach(inp => {
  inp.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); calculate(); }
  });
});

buildChips();
calculate();   // αρχικός υπολογισμός με τις προ-συμπληρωμένες τιμές
</script>
</body>
</html>
